id: manager_approval_flow
namespace: orchestration.fulfillment.subflows
description: >
  Sub-flow: Request manager approval for high-value orders and suspend on a
  native Pause. The approval service resumes THIS execution by id when the
  manager acts; a 120s timeout drives the parent's saga compensation.

inputs:
  - id: order_id
    type: STRING
    description: Order requiring approval
  - id: customer_id
    type: STRING
    description: Customer who placed the order
  - id: total_amount
    type: STRING
    description: Total order amount
  - id: items
    type: STRING
    description: JSON array of order items

variables:
  task_network: shared-services_default
  pg_host: postgres
  pg_port: "5432"
  pg_database: orchestration
  pg_user: orchestration
  pg_password: orchestration
  pg_schema: kestra_dag4
  approval_service_url: "http://approval-service:8091"

pluginDefaults:
  # Task-runner containers are siblings of the Kestra container, so they must be
  # placed on the compose network for `postgres` / the mock services to resolve.
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        networkMode: "{{ vars.task_network }}"

tasks:
  - id: request_approval
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Submit an approval request to the approval service, registering this
      execution id as the resume handle. Also records the request in the database.
    retry:
      type: exponential
      maxAttempt: 3
      interval: PT2S
      maxInterval: PT15S
    beforeCommands:
      - pip install kestra requests psycopg2-binary
    # Passed as files, not interpolated: JSON escapes `"` as \" and Python's
    # triple-quoted literals process backslashes, corrupting the JSON.
    inputFiles:
      items.json: "{{ inputs.items }}"
    script: |
      import json
      import uuid

      import psycopg2
      import requests

      order_id = "{{ inputs.order_id }}"
      customer_id = "{{ inputs.customer_id }}"
      total_amount = float("{{ inputs.total_amount }}")
      with open("items.json") as f:
          items = json.load(f)
      approval_service_url = "{{ vars.approval_service_url }}"

      approval_request_id = f"APR-{uuid.uuid4().hex[:12].upper()}"

      # Kestra has no `execution.resumeUrl`. Hand over the execution id and let
      # the approval service's `kestra` provider authenticate and post multipart.
      # This is the SUBFLOW's own execution id -- the Pause that waits lives here,
      # not in the parent, so resuming the parent would be a no-op.
      execution_id = "{{ execution.id }}"

      items_summary = ", ".join(
          f"{item['quantity']}x {item['sku']}" for item in items
      )

      payload = {
          "approval_request_id": approval_request_id,
          "order_id": order_id,
          "total_amount": total_amount,
          "customer_id": customer_id,
          "items_summary": items_summary,
          "provider": "kestra",
          "resume_data": {
              "execution_id": execution_id,
              # must match the onResume input declared on wait_for_approval
              "on_resume_field": "payload",
          },
      }

      response = requests.post(
          f"{approval_service_url}/approval-requests",
          json=payload,
          headers={"Content-Type": "application/json"},
          timeout=10,
      )

      if response.status_code != 201:
          raise Exception(
              f"Approval Service returned {response.status_code}: "
              f"{response.text[:500]}"
          )

      # Record the approval request in the database
      conn = psycopg2.connect(
          host="{{ vars.pg_host }}",
          port={{ vars.pg_port }},
          dbname="{{ vars.pg_database }}",
          user="{{ vars.pg_user }}",
          password="{{ vars.pg_password }}",
          options="-c search_path={{ vars.pg_schema }}",
      )
      try:
          cur = conn.cursor()
          cur.execute(
              """
              INSERT INTO approval_requests (approval_request_id, order_id, total_amount, status)
              VALUES (%s, %s, %s, 'pending')
              ON CONFLICT (approval_request_id) DO NOTHING
              """,
              (approval_request_id, order_id, total_amount),
          )
          cur.execute(
              "UPDATE orders SET status = 'pending_approval', updated_at = NOW() WHERE order_id = %s",
              (order_id,),
          )
          conn.commit()
      finally:
          conn.close()

      from kestra import Kestra
      Kestra.outputs({
          "approval_request_id": approval_request_id,
          "status": "submitted",
      })

  - id: wait_for_approval
    type: io.kestra.plugin.core.flow.Pause
    description: >
      Wait for the approval service to resume this execution with the manager's
      decision. Times out after 120 seconds if no decision arrives, which drives
      the saga compensation path in the parent flow.
    timeout: PT120S
    onResume:
      - id: payload
        type: STRING
        description: JSON decision envelope delivered by the approval service

  - id: record_decision
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Persist the approval decision to the database and produce the decision
      output for the parent flow.
    retry:
      type: constant
      maxAttempt: 3
      interval: PT2S
    beforeCommands:
      - pip install kestra psycopg2-binary
    # Passed as a file, not interpolated: the decision envelope carries free-text
    # `reason`, and a `"` in it arrives as \" which Python's triple-quoted literal
    # would unescape, corrupting the JSON.
    inputFiles:
      payload.json: "{{ outputs.wait_for_approval.onResume.payload }}"
    script: |
      import json
      from datetime import datetime, timezone

      import psycopg2

      # The decision arrives as the declared onResume input, not as the
      # onResume object itself.
      try:
          with open("payload.json") as f:
              approval_data = json.load(f)
      except (json.JSONDecodeError, TypeError, OSError):
          approval_data = {}

      decision = approval_data.get("decision", "unknown")
      approver = approval_data.get("approver")
      reason = approval_data.get("reason", "")
      order_id = "{{ inputs.order_id }}"
      approval_request_id = "{{ outputs.request_approval.vars.approval_request_id }}"

      conn = psycopg2.connect(
          host="{{ vars.pg_host }}",
          port={{ vars.pg_port }},
          dbname="{{ vars.pg_database }}",
          user="{{ vars.pg_user }}",
          password="{{ vars.pg_password }}",
          options="-c search_path={{ vars.pg_schema }}",
      )

      try:
          cur = conn.cursor()
          now = datetime.now(timezone.utc)

          if approval_request_id:
              cur.execute(
                  """
                  UPDATE approval_requests
                  SET status = %s, approver = %s, reason = %s, decided_at = %s
                  WHERE approval_request_id = %s
                  """,
                  (decision, approver, reason, now, approval_request_id),
              )

          new_status = "approved" if decision == "approved" else "rejected"
          cur.execute(
              "UPDATE orders SET status = %s, updated_at = %s WHERE order_id = %s",
              (new_status, now, order_id),
          )

          conn.commit()

          from kestra import Kestra
          Kestra.outputs({
              "decision": decision,
              "approver": approver or "",
              "reason": reason,
              "decided_at": now.isoformat(),
          })
      finally:
          conn.close()

errors:
  - id: approval_expired
    type: io.kestra.plugin.scripts.python.Script
    description: Handle approval timeout or unexpected error
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra
      Kestra.outputs({
          "decision": "expired",
          "approver": "",
          "reason": "Approval request timed out",
          "decided_at": "",
      })

# A parent Subflow task exposes only {state, executionId} unless the subflow
# declares flow-level outputs. Without this the parent's branch on the decision
# cannot see it, and the approval silently reads as "not approved".
outputs:
  - id: decision
    type: STRING
    value: "{{ outputs.record_decision.vars.decision ?? '' }}"
  - id: approver
    type: STRING
    value: "{{ outputs.record_decision.vars.approver ?? '' }}"
  - id: reason
    type: STRING
    value: "{{ outputs.record_decision.vars.reason ?? '' }}"
  - id: decided_at
    type: STRING
    value: "{{ outputs.record_decision.vars.decided_at ?? '' }}"
