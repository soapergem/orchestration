id: api_fanout_with_callback
namespace: orchestration.api
description: >
  API Fan-Out with Async Callback: Submit an async fetch request to the callback
  fetch service, suspend on a native Pause, and let the service resume this
  execution by id once the fetch completes; then fan out detail requests in
  parallel (capped) and combine the real fetched results.

inputs:
  - id: url
    type: STRING
    description: The URL to fetch asynchronously via the callback fetch service
  - id: api_key
    type: STRING
    required: false
    description: Optional API key for authenticated requests

variables:
  task_network: shared-services_default
  callback_fetch_service_url: "http://callback-fetch-service:8090"

pluginDefaults:
  # Task-runner containers are siblings of the Kestra container, so they must be
  # placed on the compose network for `postgres` / the mock services to resolve.
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
        networkMode: "{{ vars.task_network }}"

tasks:
  - id: submit_and_wait
    type: io.kestra.plugin.scripts.python.Script
    description: >
      POST the fetch request to the callback-fetch-service, registering this
      execution id as the resume handle. When the fetch completes the service
      calls Kestra's resume endpoint, which unpauses the flow.
    beforeCommands:
      - pip install kestra requests
    script: |
      import json
      import uuid

      import requests

      url = "{{ inputs.url }}"
      api_key = "{{ inputs.api_key }}" if "{{ inputs.api_key }}" != "" else None
      callback_fetch_service_url = "{{ vars.callback_fetch_service_url }}"
      correlation_id = str(uuid.uuid4())

      # Kestra has no `execution.resumeUrl` -- the documented execution context is
      # only id/startDate/state/originalId. Hand the service the execution id and
      # let its `kestra` provider build the resume call, which needs credentials
      # and multipart/form-data that a plain callback_url POST cannot supply.
      execution_id = "{{ execution.id }}"

      fetch_headers = {}
      if api_key:
          fetch_headers["Authorization"] = f"Bearer {api_key}"

      payload = {
          "url": url,
          "headers": fetch_headers,
          "correlation_id": correlation_id,
          "provider": "kestra",
          "resume_data": {
              "execution_id": execution_id,
              # must match the onResume input declared on wait_for_callback
              "on_resume_field": "payload",
          },
      }

      response = requests.post(
          f"{callback_fetch_service_url}/fetch-async",
          json=payload,
          headers={
              "Content-Type": "application/json",
              "User-Agent": "orchestration-bakeoff/1.0",
          },
          timeout=10,
      )

      if response.status_code != 202:
          raise Exception(
              f"Callback Fetch Service returned {response.status_code}: "
              f"{response.text[:500]}"
          )

      from kestra import Kestra
      Kestra.outputs({
          "correlation_id": correlation_id,
          "status": "submitted",
      })

  - id: wait_for_callback
    type: io.kestra.plugin.core.flow.Pause
    description: >
      Pause execution and wait for the callback-fetch-service to resume it. A
      Pause only accepts data for inputs it declares here, so `payload` must be
      declared for the fetched body to survive the suspend/resume boundary.
    # NOTE: this timeout is an absolute cap on the task that keeps counting AFTER
    # the resume -- a Pause that already succeeded flips back to FAILED (and fails
    # the execution) if the total elapses while downstream tasks are still running.
    # It is not just a "how long to wait for the callback" budget, so it has to
    # cover the whole downstream fan-out too.
    timeout: PT300S
    onResume:
      - id: payload
        type: STRING
        description: JSON result envelope delivered by the fetch service

  - id: process_fetch_result
    type: io.kestra.plugin.scripts.python.Script
    description: Normalize the callback payload into the standard items format
    beforeCommands:
      - pip install kestra
    # Passed as a file, NOT interpolated into the script body. The payload is JSON,
    # so any `"` in the upstream data arrives as \", and Python's triple-quoted
    # literals process backslashes -- corrupting the JSON before json.loads sees it.
    # Real bibliographic data hits this immediately (e.g. Dreiser's `The "genius"`).
    inputFiles:
      payload.json: "{{ outputs.wait_for_callback.onResume.payload }}"
    script: |
      import json

      # The resume payload arrives as the declared onResume input, not as the
      # onResume object itself.
      try:
          with open("payload.json") as f:
              callback_data = json.load(f)
      except (json.JSONDecodeError, TypeError, OSError):
          callback_data = {}

      callback_status = callback_data.get("status")
      if callback_status != "completed":
          raise Exception(
              f"Fetch service returned status '{callback_status}': "
              f"{callback_data.get('error', 'unknown error')}"
          )

      body = callback_data.get("body")
      if body is None:
          raise Exception("Fetch service callback contained no body")

      if isinstance(body, str):
          body = json.loads(body)

      # Normalize whatever the upstream collection looks like into the one shape
      # the fan-out needs. fixture-service serves books (`title`); the GitHub repo
      # list this DAG was first written against used `name`. Both are accepted so
      # repointing the `url` input needs no code change.
      items = []
      if isinstance(body, list):
          for item in body:
              items.append({
                  "id": item.get("id"),
                  "name": item.get("title") or item.get("name") or item.get("id"),
                  "detail_url": item.get("url"),
              })

      source_url = callback_data.get("url", "unknown")

      from kestra import Kestra
      Kestra.outputs({
          "source_url": source_url,
          "item_count": len(items),
          "items": json.dumps(items),
          "has_items": len(items) > 0,
      })

  - id: check_items
    type: io.kestra.plugin.core.flow.If
    description: Check whether there are items to fan out over
    condition: "{{ outputs.process_fetch_result.vars.has_items }}"
    then:
      - id: fan_out
        # ForEach supersedes the deprecated EachParallel and is where
        # concurrencyLimit lives -- the spec caps DAG 2 fan-out at 20.
        type: io.kestra.plugin.core.flow.ForEach
        description: Fan out detail requests for each item in parallel
        values: "{{ outputs.process_fetch_result.vars.items }}"
        concurrencyLimit: 20
        tasks:
          - id: fetch_item_detail
            type: io.kestra.plugin.scripts.python.Script
            description: Fetch detailed information for a single item
            retry:
              type: exponential
              maxAttempt: 4
              interval: PT2S
              maxInterval: PT30S
            beforeCommands:
              - pip install kestra requests
            # Passed as a file, not interpolated: the item JSON carries the book
            # title, and a `"` in it arrives as \" which Python's triple-quoted
            # literal would unescape, corrupting the JSON.
            inputFiles:
              item.json: "{{ taskrun.value }}"
            script: |
              import json

              import requests

              with open("item.json") as f:
                  item = json.load(f)
              detail_url = item["detail_url"]
              api_key = "{{ inputs.api_key }}" if "{{ inputs.api_key }}" != "" else None

              headers = {"User-Agent": "orchestration-bakeoff/1.0"}
              if api_key:
                  headers["Authorization"] = f"Bearer {api_key}"

              response = requests.get(detail_url, headers=headers, timeout=30)

              if response.status_code != 200:
                  raise Exception(
                      f"Detail API request for {item['id']} failed with status "
                      f"{response.status_code}: {response.text[:500]}"
                  )

              detail = response.json()

              from kestra import Kestra
              Kestra.outputs({
                  "id": item["id"],
                  "name": item["name"],
                  "detail": json.dumps(detail),
              })

      - id: combine_results
        type: io.kestra.plugin.scripts.python.Script
        description: Merge all fan-out API results into a summary
        beforeCommands:
          - pip install kestra
        # Passed as files, not interpolated into the script body: the rendered
        # ForEach output map contains \" escapes, and Python's triple-quoted
        # literals process backslashes, which corrupts the JSON before json.loads
        # ever sees it.
        inputFiles:
          items.json: "{{ outputs.process_fetch_result.vars.items }}"
          fanout.json: "{{ outputs.fetch_item_detail | toJson }}"
        script: |
          import json

          with open("items.json") as f:
              items = json.load(f)

          # ForEach sub-task outputs come back as a map keyed by the loop value
          # (here the JSON string of each item). Read the real fetched details --
          # re-listing the inputs would report success for items that never
          # fetched, and would make `failed` structurally always zero.
          with open("fanout.json") as f:
              fanout = json.load(f)
          by_id = {}
          for entry in fanout.values():
              got = entry.get("vars") or {}
              if got.get("id") is not None:
                  by_id[str(got["id"])] = got

          combined = []
          errors = []
          for item in items:
              key = str(item.get("id"))
              got = by_id.get(key)
              if got is None:
                  errors.append({"id": item.get("id"), "error": "no detail returned"})
                  continue
              combined.append({
                  "id": got.get("id"),
                  "name": got.get("name"),
                  "detail": json.loads(got["detail"]) if got.get("detail") else None,
              })

          from kestra import Kestra
          Kestra.outputs({
              "status": "success" if not errors else "partial",
              "source_url": "{{ outputs.process_fetch_result.vars.source_url }}",
              "total_items": len(items),
              "successful": len(combined),
              "failed": len(errors),
              "results": json.dumps(combined),
              "errors": json.dumps(errors),
          })
    else:
      - id: no_items_to_process
        type: io.kestra.plugin.core.flow.Pause
        description: No items found from initial content fetch
        timeout: PT1S

      - id: log_no_items
        type: io.kestra.plugin.scripts.python.Script
        beforeCommands:
          - pip install kestra
        script: |
          from kestra import Kestra
          Kestra.outputs({
              "status": "no_items",
              "message": "No items found from initial content fetch.",
          })

errors:
  - id: fanout_failed
    type: io.kestra.plugin.scripts.python.Script
    description: Handle unrecoverable fan-out errors
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra
      Kestra.outputs({
          "status": "failed",
          "message": "The API fan-out workflow encountered an unrecoverable error.",
      })

triggers:
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: api-fanout-trigger
    disabled: true
