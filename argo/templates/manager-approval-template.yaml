apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: manager-approval-template
  labels:
    workflow: order-fulfillment
  annotations:
    workflows.argoproj.io/description: >
      Sub-workflow: Requests manager approval via the Approval Service, then polls
      for a decision. In production, the Approval Service would call the Argo API
      PUT /api/v1/workflows/{namespace}/{name}/resume endpoint to resume the workflow
      directly. For the bake-off, we use a polling approach to avoid requiring
      Argo server API configuration.
spec:
  entrypoint: manager-approval
  arguments:
    parameters:
      - name: order-id
      - name: customer-id
      - name: total-amount
      - name: items
      - name: approval-service-url
        value: "http://approval-service:8091"
      - name: poll-interval-seconds
        value: "5"
      - name: poll-max-attempts
        value: "24"
      # Only used for standalone submission: via templateRef this resolves
      # against the calling workflow, which defines its own bakeoff-ns.
      - name: bakeoff-ns
        value: "argo"
  templates:
    # Everything this template needs arrives as an INPUT, not as
    # {{workflow.parameters.*}}. That distinction is load-bearing: when a
    # WorkflowTemplate is invoked through templateRef, `workflow.parameters`
    # resolves against the CALLING workflow, and this template's own
    # spec.arguments defaults are ignored entirely. Referencing a workflow
    # parameter the caller happens not to define fails the whole run at
    # submission with a "failed to resolve" error naming the parameter -- Argo
    # validates the entire call tree up front, so it never even starts.
    # Inputs with defaults keep the template self-contained either way.
    - name: manager-approval
      inputs:
        parameters:
          - name: order-id
          - name: customer-id
          - name: total-amount
          - name: items
          - name: approval-service-url
            value: "http://approval-service:8091"
          - name: poll-interval-seconds
            value: "5"
          - name: poll-max-attempts
            value: "24"
      # A dag/steps template does NOT expose its children's outputs
      # automatically -- it has to re-export them. Without this, the caller's
      # {{steps.run-approval.outputs.parameters.final-decision}} fails to
      # resolve and the whole workflow is rejected at submission. Note the
      # `parameter:` form (not `path:`): the value is lifted from a child task,
      # not read from a file in this template's own container.
      outputs:
        parameters:
          - name: final-decision
            valueFrom:
              parameter: "{{tasks.record-decision.outputs.parameters.final-decision}}"
      dag:
        tasks:
          - name: request-approval
            template: request-approval
            arguments:
              parameters:
                - name: order-id
                  value: "{{inputs.parameters.order-id}}"
                - name: customer-id
                  value: "{{inputs.parameters.customer-id}}"
                - name: total-amount
                  value: "{{inputs.parameters.total-amount}}"
                - name: items
                  value: "{{inputs.parameters.items}}"
                - name: approval-service-url
                  value: "{{inputs.parameters.approval-service-url}}"

          - name: poll-approval-status
            template: poll-approval-status
            dependencies:
              - request-approval
            arguments:
              parameters:
                - name: approval-request-id
                  value: "{{tasks.request-approval.outputs.parameters.approval-request-id}}"
                - name: order-id
                  value: "{{inputs.parameters.order-id}}"
                - name: approval-service-url
                  value: "{{inputs.parameters.approval-service-url}}"
                - name: poll-interval-seconds
                  value: "{{inputs.parameters.poll-interval-seconds}}"
                - name: poll-max-attempts
                  value: "{{inputs.parameters.poll-max-attempts}}"

          - name: record-decision
            template: record-decision
            dependencies:
              - poll-approval-status
            arguments:
              parameters:
                - name: decision-result
                  value: "{{tasks.poll-approval-status.outputs.parameters.decision-result}}"
                - name: order-id
                  value: "{{inputs.parameters.order-id}}"
                - name: approval-request-id
                  value: "{{tasks.request-approval.outputs.parameters.approval-request-id}}"
                - name: total-amount
                  value: "{{inputs.parameters.total-amount}}"

    # ---------- Step 1: Submit Approval Request ----------
    - name: request-approval
      inputs:
        parameters:
          - name: order-id
          - name: customer-id
          - name: total-amount
          - name: items
          - name: approval-service-url
      outputs:
        parameters:
          - name: approval-request-id
            valueFrom:
              path: /tmp/approval-request-id
      script:
        image: python:3.12-slim
        command: [python]
        source: |
          import json
          import os
          import sys
          import urllib.request
          import uuid

          order_id = "{{inputs.parameters.order-id}}"
          customer_id = "{{inputs.parameters.customer-id}}"
          total_amount = float("{{inputs.parameters.total-amount}}")
          items = json.loads('''{{inputs.parameters.items}}''')
          approval_service_url = "{{inputs.parameters.approval-service-url}}"

          approval_request_id = f"APR-{uuid.uuid4().hex[:12].upper()}"

          items_summary = ", ".join(
              f"{item['quantity']}x {item['sku']}" for item in items
          )

          # The approval service is a resume BROKER (RUNNING.md 2b): it requires a
          # provider plus a resume handle, and its model validator rejects a
          # registration it cannot classify with "cannot infer provider" -- a 422
          # that fails this step. Omitting callback_url is therefore not an option
          # any more, even though this implementation polls.
          #
          # So register http_callback with a deliberately dead URL. Polling is
          # what actually advances the workflow: _apply_decision() records the
          # decision BEFORE dispatching the resume, and the auto-decider swallows
          # dispatch failures, so `status` still flips to approved/rejected and the
          # next poll sees it. Consequence to expect: a manual POST /decide returns
          # 500 because the resume leg fails. That is cosmetic -- the decision is
          # still recorded. In production this URL would be the real Argo resume
          # endpoint (PUT /api/v1/workflows/<ns>/<name>/resume) paired with a
          # suspend node instead of the poll loop.
          payload = json.dumps({
              "approval_request_id": approval_request_id,
              "order_id": order_id,
              "total_amount": total_amount,
              "customer_id": customer_id,
              "items_summary": items_summary,
              "provider": "http_callback",
              "resume_data": {"callback_url": "http://unused.invalid/argo-polls-instead"},
          }).encode("utf-8")

          req = urllib.request.Request(
              f"{approval_service_url}/approval-requests",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              response = urllib.request.urlopen(req, timeout=10)
              if response.getcode() not in (200, 201):
                  body = response.read().decode("utf-8")[:500]
                  print(f"Approval Service returned {response.getcode()}: {body}", file=sys.stderr)
                  sys.exit(1)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8")[:500]
              print(f"Approval Service returned {e.code}: {body}", file=sys.stderr)
              sys.exit(1)

          with open("/tmp/approval-request-id", "w") as f:
              f.write(approval_request_id)

          print(f"Submitted approval request {approval_request_id} for order {order_id}")

    # ---------- Step 2: Poll for Approval Decision ----------
    # In production, replace this with an Argo suspend node + Argo API resume.
    # The approval service would call:
    #   PUT /api/v1/workflows/{namespace}/{name}/resume
    # with the decision payload.
    - name: poll-approval-status
      inputs:
        parameters:
          - name: approval-request-id
          - name: order-id
          - name: approval-service-url
          - name: poll-interval-seconds
          - name: poll-max-attempts
      outputs:
        parameters:
          - name: decision-result
            valueFrom:
              path: /tmp/decision-result.json
      script:
        image: python:3.12-slim
        command: [python]
        source: |
          import json
          import sys
          import time
          import urllib.request

          approval_request_id = "{{inputs.parameters.approval-request-id}}"
          order_id = "{{inputs.parameters.order-id}}"
          approval_service_url = "{{inputs.parameters.approval-service-url}}"
          poll_interval = int("{{inputs.parameters.poll-interval-seconds}}")
          max_attempts = int("{{inputs.parameters.poll-max-attempts}}")

          print(f"Polling approval status for {approval_request_id}")

          for attempt in range(1, max_attempts + 1):
              url = f"{approval_service_url}/approval-requests/{approval_request_id}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "orchestration-bakeoff/1.0"})
                  response = urllib.request.urlopen(req, timeout=10)
                  data = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print(f"Attempt {attempt}/{max_attempts}: Not found yet")
                      if attempt < max_attempts:
                          time.sleep(poll_interval)
                          continue
                      # Treat as expired
                      result = {
                          "decision": "expired",
                          "approver": None,
                          "reason": "Approval request not found after polling",
                          "decided_at": None,
                      }
                      with open("/tmp/decision-result.json", "w") as f:
                          json.dump(result, f)
                      sys.exit(0)
                  raise

              status = data.get("status", "pending")
              print(f"Attempt {attempt}/{max_attempts}: status={status}")

              if status in ("approved", "rejected"):
                  result = {
                      "decision": status,
                      "approver": data.get("approver"),
                      "reason": data.get("reason", ""),
                      "decided_at": data.get("decided_at"),
                  }
                  with open("/tmp/decision-result.json", "w") as f:
                      json.dump(result, f)
                  print(f"Approval decision received: {status}")
                  sys.exit(0)
              elif status == "pending":
                  if attempt < max_attempts:
                      time.sleep(poll_interval)
                      continue
                  # Expired
                  result = {
                      "decision": "expired",
                      "approver": None,
                      "reason": "Approval request timed out",
                      "decided_at": None,
                  }
                  with open("/tmp/decision-result.json", "w") as f:
                      json.dump(result, f)
                  print("Approval expired: polling exhausted")
                  sys.exit(0)
              else:
                  print(f"Unexpected approval status: {status}", file=sys.stderr)
                  sys.exit(1)

          result = {
              "decision": "expired",
              "approver": None,
              "reason": "Approval request timed out",
              "decided_at": None,
          }
          with open("/tmp/decision-result.json", "w") as f:
              json.dump(result, f)
      # Template-level field, NOT a `script:` field -- nesting it under `script`
      # is rejected outright by the API server with a strict-decoding error
      # ("unknown field spec.templates[2].script.activeDeadlineSeconds"), so the
      # whole WorkflowTemplate fails to register.
      activeDeadlineSeconds: 180

    # ---------- Step 3: Record Decision in Database ----------
    - name: record-decision
      inputs:
        parameters:
          - name: decision-result
          - name: order-id
          - name: approval-request-id
          - name: total-amount
      outputs:
        parameters:
          - name: final-decision
            valueFrom:
              path: /tmp/final-decision.json
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff:
          duration: "2s"
          factor: "2"
      script:
        image: python:3.12-slim
        command: [sh, -c]
        source: |
          pip install psycopg2-binary --quiet 2>/dev/null && python3 <<'PYEOF'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import psycopg2

          decision_data = json.loads('''{{inputs.parameters.decision-result}}''')
          order_id = "{{inputs.parameters.order-id}}"
          approval_request_id = "{{inputs.parameters.approval-request-id}}"
          total_amount = float("{{inputs.parameters.total-amount}}")

          decision = decision_data.get("decision", "unknown")
          approver = decision_data.get("approver")
          reason = decision_data.get("reason", "")

          conn = psycopg2.connect(
              host=os.environ.get("PGHOST", "postgres"),
              port=int(os.environ.get("PGPORT", "5432")),
              dbname=os.environ.get("PGDATABASE", "orchestration"),
              user=os.environ.get("PGUSER", "orchestration"),
              password=os.environ.get("PGPASSWORD", "orchestration"),
          )

          # ---- Per-(runner, DAG) schema isolation ----
          # This schema holds seeded customers/inventory, so it is NOT
          # self-creating. Check it up front: SET search_path to a missing schema
          # succeeds silently and every later query then fails with
          # "relation does not exist".
          BAKEOFF_NS = os.environ.get("BAKEOFF_NS", "argo")
          SCHEMA = f"{BAKEOFF_NS}_dag4"
          with conn.cursor() as _cur:
              _cur.execute(
                  "SELECT 1 FROM information_schema.schemata WHERE schema_name = %s",
                  (SCHEMA,),
              )
              if _cur.fetchone() is None:
                  raise RuntimeError(
                      f'schema "{SCHEMA}" does not exist -- seed it with: '
                      f"SELECT bootstrap_bakeoff('{BAKEOFF_NS}');"
                  )
              _cur.execute(f'SET search_path TO "{SCHEMA}"')

          try:
              cur = conn.cursor()
              now = datetime.now(timezone.utc)

              # Persist the approval itself, not just its effect on the order.
              # Every other implementation in this bake-off writes this table, and
              # keeping them behaviourally equivalent is the point of the exercise.
              # Upsert rather than plain INSERT: unlike the polling-free tools,
              # this step is the FIRST place Argo touches the DB for an approval,
              # so no 'pending' row exists yet. (Divergence worth noting: Prefect
              # et al. write a pending row at submit time, so a mid-flight observer
              # can see an undecided approval in the DB; Argo cannot.)
              cur.execute(
                  """
                  INSERT INTO approval_requests
                      (approval_request_id, order_id, total_amount, status,
                       approver, reason, decided_at)
                  VALUES (%s, %s, %s, %s, %s, %s, %s)
                  ON CONFLICT (approval_request_id) DO UPDATE
                     SET status = EXCLUDED.status,
                         approver = EXCLUDED.approver,
                         reason = EXCLUDED.reason,
                         decided_at = EXCLUDED.decided_at
                  """,
                  (approval_request_id, order_id, total_amount, decision,
                   approver, reason, now),
              )

              if order_id:
                  new_status = "approved" if decision == "approved" else "rejected"
                  cur.execute(
                      "UPDATE orders SET status = %s, updated_at = %s WHERE order_id = %s",
                      (new_status, now, order_id),
                  )

              conn.commit()

              result = {
                  "decision": decision,
                  "approver": approver,
                  "reason": reason,
                  "decided_at": now.isoformat(),
              }
              with open("/tmp/final-decision.json", "w") as f:
                  json.dump(result, f)
              print(f"Recorded approval decision: {decision} for order {order_id}")
          finally:
              conn.close()
          PYEOF
        env:
          - name: BAKEOFF_NS
            value: "{{workflow.parameters.bakeoff-ns}}"
          - name: PGHOST
            value: "postgres"
          - name: PGPORT
            value: "5432"
          - name: PGDATABASE
            value: "orchestration"
          - name: PGUSER
            value: "orchestration"
          - name: PGPASSWORD
            value: "orchestration"
