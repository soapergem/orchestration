# NOTE ON THE `domain:` FIELDS BELOW
# They ship as `example.com` placeholders on purpose. `deploy.sh` overrides all
# four from $BASE_DOMAIN (or $PUBLIC_DOMAIN) at install time, so the normal path
# is to set that in `.envrc` -- see `.envrc.example` -- and never edit this file.
# Deploying with the placeholders left in place gives you ingress rules that
# resolve nowhere and a cert-manager Order that retries forever.

image:
  # Pre-existing docker-registry secret for pulling from private ECR. The K3s
  # cluster refreshes this out-of-band; the chart only references it. Set to ""
  # to omit imagePullSecrets (public images / node-level pull auth).
  pullSecretName: k8s-ecr-login-renew-docker-secret

aws:
  region: us-east-1
  # Pre-existing Secret holding creds for states:SendTaskSuccess. Used by
  # callback-fetch and approval to resume suspended Step Functions executions.
  # Keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
  resumeSecretName: aws-resume-creds

# Per-service repositories come from `terraform output -json ecr_repository_urls`
# (one repo per service). Fill in the full ECR repo URL for each.
callbackFetch:
  name: callback-fetch
  repository: ""                       # <acct>.dkr.ecr.us-east-1.amazonaws.com/callback-fetch
  tag: latest
  replicas: 1
  port: 8090
  domain: orch-callback-fetch.example.com
  autoResume: "true"                   # resume the SFN task as soon as the fetch completes

approval:
  name: approval
  repository: ""                       # <acct>.dkr.ecr.us-east-1.amazonaws.com/approval
  tag: latest
  replicas: 1
  port: 8091
  domain: orch-approval.example.com
  autoDecideDelaySeconds: "10"         # auto-decide + resume after a delay (hands-off DAG 4)
  autoDecideAction: approved

shipping:
  name: shipping
  repository: ""                       # <acct>.dkr.ecr.us-east-1.amazonaws.com/shipping
  tag: latest
  replicas: 1
  port: 8092
  domain: orch-shipping.example.com

# Read-only Books API for DAG 2 plus DAG 1's ZIP (RUNNING.md 0b). No DB, no AWS.
# The Step Functions path needs it publicly reachable (Lambdas run outside the
# cluster); in-cluster callers (Argo, Flyte) use http://fixture-service:8099.
fixture:
  name: fixture-service
  repository: ""                       # <acct>.dkr.ecr.us-east-1.amazonaws.com/fixture-service
  tag: latest
  replicas: 1
  port: 8099
  domain: orch-fixture.example.com
  defaultPerPage: "5"                  # raise past 20 to exercise DAG 2's concurrency cap
  baseUrl: ""                          # leave empty: detail URLs are derived per request
  # Neither data file is committed or baked into the image; the pod fetches both
  # from S3 on boot. From `terraform output fixture_books_url` /
  # `fixture_sample_zip_url`.
  #  - booksUrl empty  -> /books and /health return 503 (readiness fails, loudly)
  #  - sampleZipUrl empty -> only /sample-data.zip fails; DAG 2 is unaffected
  booksUrl: ""                         # s3://<bucket>/input/books.json.gz
  sampleZipUrl: ""                     # s3://<bucket>/input/sample-data.zip
  # Secret holding the read-only S3 creds from `terraform output
  # fixture_reader_access_key_id` / `..._secret_access_key`.
  # Keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY. Only needed for an s3:// URL.
  s3SecretName: fixture-s3-creds

ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-prod
  middlewareName: mock-force-https
