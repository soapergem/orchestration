{{/*
Read-only data service: no database, no resume duties. Its only AWS use is a
one-shot S3 GET on boot for DAG 1's archive and DAG 2's corpus, which is a
DIFFERENT credential from the resume user -- fixture.s3SecretName, not
aws.resumeSecretName.
*/}}
{{- $urls := printf "%s%s" .Values.fixture.booksUrl .Values.fixture.sampleZipUrl }}
{{- $env := list
  (dict "name" "FIXTURE_DEFAULT_PER_PAGE" "value" (.Values.fixture.defaultPerPage | toString))
}}
{{- if .Values.fixture.booksUrl }}
{{- $env = append $env (dict "name" "FIXTURE_BOOKS_URL" "value" .Values.fixture.booksUrl) }}
{{- end }}
{{- if .Values.fixture.sampleZipUrl }}
{{- $env = append $env (dict "name" "FIXTURE_SAMPLE_ZIP_URL" "value" .Values.fixture.sampleZipUrl) }}
{{- end }}
{{- if $urls }}
{{- $env = append $env (dict "name" "AWS_REGION" "value" .Values.aws.region) }}
{{- if and .Values.fixture.s3SecretName (contains "s3://" $urls) }}
{{- $env = append $env (dict "name" "AWS_ACCESS_KEY_ID" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.fixture.s3SecretName "key" "AWS_ACCESS_KEY_ID"))) }}
{{- $env = append $env (dict "name" "AWS_SECRET_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" .Values.fixture.s3SecretName "key" "AWS_SECRET_ACCESS_KEY"))) }}
{{- end }}
{{- end }}
{{- if .Values.fixture.baseUrl }}
{{/* Only needed when the caller fetching /books and the caller fetching the
     per-item details are on different networks. In-cluster both legs resolve
     `fixture-service`, so this is normally empty and detail URLs are derived
     per request. The Step Functions path is the exception: its fan-out runs in
     Lambda, so the details must be reachable publicly. */}}
{{- $env = append $env (dict "name" "FIXTURE_BASE_URL" "value" .Values.fixture.baseUrl) }}
{{- end }}
{{- include "bakeoff.service" (dict "svc" .Values.fixture "root" $ "env" $env) }}
