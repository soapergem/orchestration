{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mock-services
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Values.ingress.middlewareName }}@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.callbackFetch.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.callbackFetch.name }}
            port:
              number: {{ .Values.callbackFetch.port }}
  - host: {{ .Values.approval.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.approval.name }}
            port:
              number: {{ .Values.approval.port }}
  - host: {{ .Values.shipping.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.shipping.name }}
            port:
              number: {{ .Values.shipping.port }}
  tls:
  - hosts:
    - {{ .Values.callbackFetch.domain }}
    secretName: {{ .Values.callbackFetch.name }}-tls
  - hosts:
    - {{ .Values.approval.domain }}
    secretName: {{ .Values.approval.name }}-tls
  - hosts:
    - {{ .Values.shipping.domain }}
    secretName: {{ .Values.shipping.name }}-tls
{{- end }}
