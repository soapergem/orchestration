apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.approval.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.approval.name }}
spec:
  replicas: {{ .Values.approval.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.approval.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.approval.name }}
    spec:
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      containers:
      - name: approval
        image: {{ .Values.approval.repository }}:{{ .Values.approval.tag }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.approval.port }}
        env:
        # Auto-decide + resume after a delay so DAG 4 runs hands-off.
        - name: AUTO_DECIDE_DELAY_SECONDS
          value: {{ .Values.approval.autoDecideDelaySeconds | quote }}
        - name: AUTO_DECIDE_ACTION
          value: {{ .Values.approval.autoDecideAction | quote }}
        - name: AWS_REGION
          value: {{ .Values.aws.region | quote }}
        # Credentials for states:SendTaskSuccess (dedicated IAM user; see deploy/README.md).
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.aws.resumeSecretName }}
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.aws.resumeSecretName }}
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.approval.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.approval.name }}
spec:
  ports:
  - name: http
    port: {{ .Values.approval.port }}
    targetPort: {{ .Values.approval.port }}
  selector:
    app: {{ .Values.approval.name }}
