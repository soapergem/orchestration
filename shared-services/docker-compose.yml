# Shared services + orchestrator engines for the bake-off.
#
# Base services (postgres + the four mock services) have NO profile, so they
# always start with `podman compose up`. Each orchestrator engine is gated
# behind a profile, so normally you bring up ONE at a time:
#
#   just up                  # just the shared backbone
#   just up temporal         # backbone + Temporal   (also: hatchet, kestra, conductor)
#   just up-all              # backbone + ALL four engines, no worker sidecars
#   just down-all            # stop everything -- a bare `just down` does NOT
#                            # reach profile-gated services (see the Justfile)
#
# Why profiles: the bake-off tests one orchestrator at a time, and four engines
# at once is heavy (Kestra and Conductor are both JVMs). It is no longer a
# *correctness* constraint -- RUNNING.md §0 gave every engine its own host port,
# and all four profiles now resolve with zero collisions, which is what makes
# `just up-all` safe. Earlier revisions of this comment claimed the engines
# wanted overlapping ports; that has not been true since the port map landed.
#
# Podman note: everything here shares one compose network, so services reach
# each other by service name (postgres, callback-fetch-service, etc.). The
# DAG code already defaults to these names. The only cross-boundary case is a
# worker running on the HOST (outside compose) that a container must call back
# into -- for that, use `host.containers.internal` (Podman's host gateway).
# See RUNNING.md for the per-orchestrator details.

services:
  # ------------------------------------------------------------------ backbone
  postgres:
    restart: unless-stopped
    image: postgres:16
    # `just up-all` runs four engines against this one server and the stock
    # max_connections=100 is not enough for them: measured on a bare up-all,
    # temporal held 67 connections, hatchet 13, conductor 10, kestra 10 -- exactly
    # 100, leaving nothing for the mock services, host-run workers, or a GUI
    # client (the symptom is `FATAL: sorry, too many clients already`, and it
    # exhausts the superuser-reserved slots too, so even psql inside the
    # container is locked out). 300 leaves room for all of that at once; each
    # slot costs a few hundred KB of shared memory, so the overhead is trivial.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: orchestration
      POSTGRES_USER: orchestration
      POSTGRES_PASSWORD: orchestration
      # Which runners this instance onboards on a FRESH volume. This pod hosts
      # the 8 host-run tools; argo/flyte live on the in-cluster postgres and
      # stepfunctions/google_workflows on Neon, so none of those belong here.
      # The list used to be hardcoded in init-db.sql, which both databases share
      # -- see that file's tail comment for why that leaked across instances.
      BAKEOFF_RUNNERS: "airflow dagster prefect luigi temporal hatchet kestra conductor"
    ports:
      - "54321:5432"          # non-standard host port to avoid conflicts with local Postgres
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
      - ./init-engines.sql:/docker-entrypoint-initdb.d/01-init-engines.sql:ro
      # Numeric prefix matters: the entrypoint runs this directory in lexical
      # order and this needs bootstrap_bakeoff() to already exist.
      - ./init-runners.sh:/docker-entrypoint-initdb.d/02-init-runners.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestration"]
      interval: 5s
      timeout: 3s
      retries: 5

  callback-fetch-service:
    restart: unless-stopped
    build: ./callback-fetch-service
    ports:
      - "8090:8090"
    # Reach the host signal-relay server (finch/Lima gateway). host.docker.internal
    # isn't reliably auto-added on finch compose recreates, so pin it explicitly.
    extra_hosts:
      - "host.docker.internal:192.168.5.2"
    environment:
      FETCH_DELAY_MIN_SECONDS: "2"
      FETCH_DELAY_MAX_SECONDS: "10"
      FETCH_TIMEOUT_SECONDS: "30"
      # Flip to "true" for hands-off DAG 2: the service fires the resume itself
      # when the fetch completes. Left off so resume is a manual /resume call.
      AUTO_RESUME: "true"
      AUTO_RESUME_DELAY_SECONDS: "0"
      # Credentials for the `kestra` resume provider. Kestra's execution id is an
      # identifier, not a capability token like a Step Functions task token, so
      # the resume call must authenticate separately. OSS has no scoped service
      # accounts, so this is the shared admin account -- evaluation-grade only.
      KESTRA_URL: "${KESTRA_INTERNAL_URL:-http://kestra:8080}"
      KESTRA_TENANT: "${KESTRA_TENANT:-main}"
      KESTRA_USER: "${KESTRA_USER:-admin@orchestration.local}"
      KESTRA_PASSWORD: "${KESTRA_PASSWORD:-Orchestration_123}"
      # Base URL for the `conductor` resume provider. Unlike Kestra this needs no
      # credentials: Conductor OSS ships with no authentication at all.
      CONDUCTOR_URL: "${CONDUCTOR_INTERNAL_URL:-http://conductor-server:8080}"
    depends_on:
      postgres:
        condition: service_healthy

  approval-service:
    restart: unless-stopped
    build: ./approval-service
    ports:
      - "8091:8091"
    extra_hosts:
      - "host.docker.internal:192.168.5.2"
    environment:
      # Overridable so the DAG 4 saga paths can be driven without editing this
      # file, e.g. AUTO_DECIDE_ACTION=rejected just up, or =none to let the
      # approval WAIT task time out.
      AUTO_DECIDE_DELAY_SECONDS: "${AUTO_DECIDE_DELAY_SECONDS:-10}"
      AUTO_DECIDE_ACTION: "${AUTO_DECIDE_ACTION:-approved}"
      # See callback-fetch-service for why the Kestra resume needs credentials.
      KESTRA_URL: "${KESTRA_INTERNAL_URL:-http://kestra:8080}"
      KESTRA_TENANT: "${KESTRA_TENANT:-main}"
      KESTRA_USER: "${KESTRA_USER:-admin@orchestration.local}"
      KESTRA_PASSWORD: "${KESTRA_PASSWORD:-Orchestration_123}"
      CONDUCTOR_URL: "${CONDUCTOR_INTERNAL_URL:-http://conductor-server:8080}"
    depends_on:
      postgres:
        condition: service_healthy

  # Mock Books API backing DAG 2 (GET /books -> summaries with detail URLs, then
  # GET /books/{id}), plus DAG 1's ZIP. Reachable in-network as
  # `fixture-service:8099` and from the host as `localhost:8099`; detail URLs are
  # derived per request, so both work without configuration. Replaces DAG 2's
  # api.github.com default, which burned a shared 60/hour IP limit.
  fixture-service:
    restart: unless-stopped
    build: ./fixture-service
    ports:
      - "8099:8099"
    volumes:
      # Both data files are uncommitted build artefacts living in test-data/:
      #   books.json.gz    <- shared-services/fixture-service/build_dataset.py
      #   sample-data.zip  <- test-data/make-sample-data.py
      # Deployed environments have no host mount and fetch them from S3 instead.
      - ../test-data:/data:ro
    environment:
      # DAG 2's fan-out width when a caller doesn't pass ?per_page. The corpus
      # is thousands of works, so ?per_page=30 overshoots the spec's cap of 20.
      FIXTURE_DEFAULT_PER_PAGE: "5"
      # Fallbacks, used only when the file is absent from the mount above.
      # s3://bucket/key (needs AWS creds) or https://. From `terraform output`.
      FIXTURE_BOOKS_URL: "${FIXTURE_BOOKS_URL:-}"
      FIXTURE_SAMPLE_ZIP_URL: "${FIXTURE_SAMPLE_ZIP_URL:-}"

  shipping-service:
    restart: unless-stopped
    build: ./shipping-service
    ports:
      - "8092:8092"
    environment:
      SHIPPING_SUCCESS_RATE: "0.70"
      SHIPPING_TIMEOUT_RATE: "0.15"
      SHIPPING_SERVER_ERROR_RATE: "0.10"
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------ temporal
  # Server + Web UI run as containers. The worker and signal-relay server run
  # on the HOST via `uv run` (no Dockerfiles exist for them, and the SDK lives
  # in pyproject). See RUNNING.md for the host env block, including the
  # host.containers.internal wiring for the signal server callback.
  temporal:
    image: docker.io/temporalio/auto-setup:1.27.2
    profiles: ["temporal"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12              # driver name for PostgreSQL in auto-setup
      DB_PORT: "5432"
      POSTGRES_USER: orchestration
      POSTGRES_PWD: orchestration
      POSTGRES_SEEDS: postgres    # auto-setup creates the temporal + temporal_visibility DBs
      # auto-setup runs frontend/history/matching/worker in one container and each
      # opens its own pools, so the defaults (SQL 20, visibility 10) come to 120
      # potential connections -- 67 in practice, two thirds of the server. These
      # caps bring it to ~40 max. Plenty for a single-node evaluation; raise them
      # if history tasks start queueing.
      SQL_MAX_CONNS: "6"
      SQL_MAX_IDLE_CONNS: "3"
      SQL_VIS_MAX_CONNS: "4"
      SQL_VIS_MAX_IDLE_CONNS: "2"
    ports:
      - "7233:7233"               # gRPC -- host worker connects here

  temporal-worker:
    build:
      context: ..
      dockerfile: temporal/Dockerfile
    profiles: ["temporal"]
    depends_on:
      - temporal
      - postgres
    volumes:
      - ../test-data:/app/test-data:ro
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: orchestration
      POSTGRES_USER: orchestration
      POSTGRES_PASSWORD: orchestration
      CALLBACK_FETCH_SERVICE_URL: http://callback-fetch-service:8090
      APPROVAL_SERVICE_URL: http://approval-service:8091
      SHIPPING_SERVICE_URL: http://shipping-service:8092
      # Per-(runner, dag) schema isolation: DB layer uses search_path "<BAKEOFF_NS>_<dag>".
      BAKEOFF_NS: temporal
      # DAG 2/4 async callback: workflows hand this URL to the mock services, which
      # POST back to the signal-relay server on the host (finch host gateway).
      SIGNAL_SERVER_URL: http://host.docker.internal:8095

  temporal-ui:
    image: docker.io/temporalio/ui:2.34.0
    profiles: ["temporal"]
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"               # http://localhost:8233

  # ------------------------------------------------------------------- hatchet
  # PostgreSQL-only engine via the all-in-one hatchet-lite image (engine + API
  # + dashboard). The worker runs on the HOST via `uv run` after you mint a
  # client token (see RUNNING.md -- the token can't be baked in statically).
  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest  # port layout verified 2026-08-03
    profiles: ["hatchet"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://orchestration:orchestration@postgres:5432/hatchet?sslmode=disable"
      # Baked into every minted token as the `server_url` claim, which the SDK
      # trusts for all REST calls. The generated default is http://localhost:8080
      # -- on this host that is AIRFLOW, and SDK calls silently get Airflow's
      # error JSON back. Point it at the published API port instead.
      SERVER_URL: "http://localhost:8888"
      SERVER_AUTH_COOKIE_SECRETS: "changeme-cookie-secret-1 changeme-cookie-secret-2"
      SERVER_AUTH_COOKIE_DOMAIN: "localhost"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "true"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "true"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet-engine:7070"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
    ports:
      - "8888:8888"               # dashboard + REST API -> http://localhost:8888
      - "7077:7070"               # gRPC -- host worker connects here (container listens on 7070)

  hatchet-worker:
    build:
      context: ..
      dockerfile: hatchet/Dockerfile
    profiles: ["hatchet"]
    depends_on:
      - hatchet-engine
      - postgres
    volumes:
      - ../test-data:/app/test-data:ro
    environment:
      HATCHET_CLIENT_TOKEN: "${HATCHET_CLIENT_TOKEN}"
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: orchestration
      POSTGRES_USER: orchestration
      POSTGRES_PASSWORD: orchestration
      CALLBACK_FETCH_SERVICE_URL: http://callback-fetch-service:8090
      APPROVAL_SERVICE_URL: http://approval-service:8091
      SHIPPING_SERVICE_URL: http://shipping-service:8092

  # -------------------------------------------------------------------- kestra
  # Kestra runs its YAML flows itself -- no separate worker. The `kestra.url`
  # setting below is the critical bit: it's the base of the resumeUrl handed to
  # the callback/approval services, so it MUST be an in-network address those
  # containers can reach (the service name `kestra`), not localhost.
  kestra:
    image: docker.io/kestra/kestra:latest
    profiles: ["kestra"]
    depends_on:
      postgres:
        condition: service_healthy
    command: server standalone
    user: "root"
    # Kestra treats a lost Postgres connection as fatal: every queue-consumer
    # thread logs "Fatal error while polling the '<type>' queue. Initiating
    # shutdown." and the process exits **status 0**. It does not reconnect, and
    # there is no setting to make it; upstream has open issues in this area
    # (kestra-io/kestra#4076, #5147, #10358). Measured behaviour:
    #
    #   ~5s blip   -> logs the fatal error on all consumers but SURVIVES
    #   ~40s outage -> exits 0, and every in-flight execution is lost
    #                  (flow definitions survive: the repository is Postgres too)
    #
    # MUST be unless-stopped, not on-failure: a zero exit reads as a clean
    # shutdown, so on-failure would never fire.
    restart: unless-stopped
    # The healthcheck is not belt-and-braces, it is load-bearing. If the restart
    # above happens while Postgres is still down, Kestra fails DNS
    # (UnknownHostException: postgres -- a stopped container loses its alias),
    # never retries, and sits there with a live JVM: the container reports
    # "running" while serving nothing. Without this probe that wedge is invisible.
    # Neither podman nor docker restarts an unhealthy container, so recovery is
    # still manual: `podman restart shared-services_kestra_1` (~18s, verified).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: orchestration
            password: orchestration
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          url: http://kestra:8080/
          variables:
            globals:
              # Docker-task-runner containers are siblings of this one, not
              # children: they join the default bridge unless told otherwise,
              # where compose DNS names like `postgres` do not resolve. Flows
              # read this back as `{{ globals.task_network }}`.
              task_network: shared-services_default
          server:
            basic-auth:
              username: admin@orchestration.local
              password: Orchestration_123
    ports:
      # Host port only; `kestra.url` above stays :8080 because resume URLs are
      # resolved container-to-container. The host side defaults to 8081 because
      # 8080 belongs to Airflow in the port map (RUNNING.md §0).
      - "${KESTRA_PORT:-8081}:8080"
    volumes:
      - kestra-data:/app/storage
      - ../kestra:/flows:ro       # flow YAMLs; load via UI or `kestra flow namespace update`
      # Script tasks default to Kestra's DOCKER task runner, which needs a
      # Docker-compatible Engine API socket. Podman:
      #   systemctl --user enable --now podman.socket
      #   CONTAINER_SOCK=/run/user/$(id -u)/podman/podman.sock just up kestra
      # docker: /var/run/docker.sock. finch: see prefect/deploy_docker.py.
      - "${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"

  # ----------------------------------------------------------------- conductor
  # Server + UI in ONE container (nginx serves the UI on :5000, Spring Boot the
  # API on :8080). No Elasticsearch: config-postgres.properties sets
  # conductor.indexing.type=postgres and conductor.elasticsearch.version=0, so
  # metadata, the task queues and the search index all live in the `conductor`
  # database. That makes it the lightest engine here after hatchet-lite.
  #
  # Workers run on the HOST via `uv run python conductor/worker.py` -- the Python
  # SDK lives in pyproject, and workers POLL the server (no inbound connection),
  # so no host-gateway wiring is needed for them. The mock services DO need to
  # reach the server to resume WAIT tasks; they use `conductor-server:8080`.
  conductor-server:
    image: docker.io/conductoross/conductor:3.31.0
    profiles: ["conductor"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Names a file under /app/config -- see the volume mount below. This must
      # be a FILE: Conductor turns every key in it into a Java system property,
      # which outranks environment variables, so SPRING_DATASOURCE_URL and
      # friends are silently ignored whenever CONFIG_PROP is set. The reasoning
      # is spelt out at the top of conductor/config.properties.
      CONFIG_PROP: bakeoff.properties
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - ./conductor/config.properties:/app/config/bakeoff.properties:ro
    ports:
      - "8000:8080"               # REST API  -> http://localhost:8000/api
      - "8127:5000"               # UI        -> http://localhost:8127
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  pgdata:
  kestra-data:
