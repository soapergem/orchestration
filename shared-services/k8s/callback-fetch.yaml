apiVersion: apps/v1
kind: Deployment
metadata:
  name: callback-fetch
  namespace: orchestrators
  labels:
    app: callback-fetch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: callback-fetch
  template:
    metadata:
      labels:
        app: callback-fetch
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: callback-fetch
          image: ${CALLBACK_FETCH_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            # Resume the suspended Step Functions task as soon as the fetch completes.
            - name: AUTO_RESUME
              value: "true"
            - name: AWS_REGION
              value: us-east-1
            # Credentials for states:SendTaskSuccess (dedicated IAM user; see k8s/README.md).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-resume-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-resume-creds
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: callback-fetch
  namespace: orchestrators
spec:
  selector:
    app: callback-fetch
  ports:
    - port: 8090
      targetPort: 8090
