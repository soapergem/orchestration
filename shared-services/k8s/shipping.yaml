apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: orchestrators
  labels:
    app: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: shipping
          image: ${SHIPPING_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8092
          # Flaky shipping simulator; no AWS access needed (no callback/resume).
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: orchestrators
spec:
  selector:
    app: shipping
  ports:
    - port: 8092
      targetPort: 8092
