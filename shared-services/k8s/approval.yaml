apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval
  namespace: orchestrators
  labels:
    app: approval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approval
  template:
    metadata:
      labels:
        app: approval
    spec:
      imagePullSecrets:
        - name: ecr-creds
      containers:
        - name: approval
          image: ${APPROVAL_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
          env:
            # Auto-decide + resume after a delay so DAG 4 runs hands-off.
            - name: AUTO_DECIDE_DELAY_SECONDS
              value: "10"
            - name: AUTO_DECIDE_ACTION
              value: approved
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-resume-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-resume-creds
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: approval
  namespace: orchestrators
spec:
  selector:
    app: approval
  ports:
    - port: 8091
      targetPort: 8091
