# Conductor server configuration for the bake-off.
#
# WHY THIS FILE EXISTS INSTEAD OF ENVIRONMENT VARIABLES
#
# The obvious way to point the stock image at our shared Postgres is
# SPRING_DATASOURCE_URL -- and it silently does nothing. Conductor's main class
# (`Conductor.loadExternalConfig()`) reads the file named by CONFIG_PROP and
# calls `System.setProperty()` for every key in it. Java system properties rank
# ABOVE OS environment variables in Spring Boot's property hierarchy, so the
# properties file wins over every SPRING_* / CONDUCTOR_* env var you set. That
# is the exact inverse of what Spring Boot users expect, and the failure mode is
# quiet: Hikari just logs "HikariPool-1 - Starting..." on a loop until the
# context finally fails, with the real cause (UnknownHostException: postgresdb,
# the sidecar hostname baked into the stock config-postgres.properties) buried
# a hundred lines down a nested Spring bean-creation stack trace.
#
# So: configure Conductor by mounting a file, not by setting env vars.

# ---- persistence -----------------------------------------------------------
# Metadata, task queues, external payloads AND the search index all live in
# Postgres. Note conductor.indexing.type=postgres plus elasticsearch.version=0:
# Conductor needs NO Elasticsearch, which is what keeps this a single container.
conductor.db.type=postgres
conductor.queue.type=postgres
conductor.external-payload-storage.type=postgres
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0

# The shared bake-off Postgres (compose DNS name; host port is 54321).
spring.datasource.url=jdbc:postgresql://postgres:5432/conductor
spring.datasource.username=orchestration
spring.datasource.password=orchestration
spring.datasource.hikari.maximum-pool-size=10

# ---- server behaviour ------------------------------------------------------
# The stock config ships loadSample=true, which registers a "kitchen sink"
# workflow on every boot and buries the bake-off's workflows in the UI list.
loadSample=false

# How long a task sits before the sweeper reconsiders it. The default is 60s,
# which makes DAG 1's fan-out and DAG 3's retries feel broken when you are
# watching them; 10s matches what upstream uses for its own concurrency tests.
conductor.app.taskExecutionPostponeDuration=10s

# Task timeouts are enforced by a background SWEEPER, not by a timer, so they
# fire late and the lateness is bounded by how often a workflow is re-decided.
# `workflowOffsetTimeout` is the visibility offset used when a workflow is
# pushed onto the decider queue (default 30s). Even at 5s, DAG 2's 60s WAIT
# timeout was observed firing at 103s -- treat Conductor's `timeoutSeconds` as
# "not before", never as a deadline. See conductor/README.md §Findings.
conductor.app.workflowOffsetTimeout=5s
conductor.app.sweeperThreadCount=8
conductor.app.sweeperWorkflowPollTimeout=2000ms

# NOTE: `conductor.app.sweeperFrequencyMillis` -- which older Netflix-era docs
# and blog posts still recommend -- does NOT exist in 3.31.0 (zero occurrences
# in the source). Spring ignores unknown keys silently, AND `/api/admin/config`
# echoes back whatever you set rather than what the server actually bound, so a
# dead property looks perfectly applied. Do not trust that endpoint as proof.

# ---- observability ---------------------------------------------------------
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus,health,info

# NOT enabled, despite the stock config-postgres.properties shipping
# `conductor.file-storage.enabled=true` + `type=conductor`: in the 3.31.0 image
# that combination has no matching `FileStorage` bean, and the server dies at
# startup with "Parameter 0 of constructor in FileStorageServiceImpl required a
# bean of type FileStorage that could not be found". The shipped example config
# does not boot the shipped image. Nothing here needs it -- DAG 1 writes its
# Parquet to the filesystem, not to Conductor's blob store.
conductor.file-storage.enabled=false
