# Payment Processing: Validate, process with retries, update DB, send notification
#
# Deploy: terraform/gcp  (or, by hand:
#   gcloud workflows deploy orch-dag3-payment --source=dag3_payment.yaml \
#     --set-env-vars TASK_SERVICE_URL=https://...,BAKEOFF_NS=google_workflows)
#
# Every step body is an HTTP call to the Cloud Run task service -- Workflows runs
# no code of its own. Retry classification is therefore driven entirely by HTTP
# status: the gateway returns 402 for a decline (routed straight to failure
# handling) and 503/504 for transient faults (retried with backoff). Contrast
# Temporal/Prefect, which classify on exception type.
#
# Service URLs come from user_env_vars rather than being templated in, because
# Terraform's templatefile() would collide with this language's own ${} syntax.
#
# Expected input (accounts come from bootstrap_bakeoff -- ACC-001..ACC-004):
# {
#   "payment_id": "PAY-001",
#   "amount": 100.00,
#   "currency": "USD",
#   "from_account": "ACC-001",
#   "to_account": "ACC-002",
#   "idempotency_key": "PAY-001",
#   "gateway_force": "",          # ""|success|declined|server_error|timeout
#   "db_config": { "host": "...", "port": 5432, "database": "orchestration", "user": "...", "password": "..." }
# }
#
# Failure branches to try:
#   from_account: "ACC-004"     -> suspended account, validation fails
#   amount: 99999               -> insufficient balance
#   gateway_force: "declined"   -> 402, non-retriable, no retry storm
#   gateway_force: "timeout"    -> 504, retried with backoff until it succeeds

main:
  params: [input]
  steps:
    - init:
        assign:
          # One Cloud Run service backs all of these; the paths differ, not the
          # host. Split into three names to keep the parallel with the Step
          # Functions lambdas (db / gateway / notification) legible.
          - task_service_url: ${sys.get_env("TASK_SERVICE_URL")}
          - db_proxy_url: ${sys.get_env("TASK_SERVICE_URL")}
          - payment_gateway_url: ${sys.get_env("TASK_SERVICE_URL")}
          - notification_service_url: ${sys.get_env("TASK_SERVICE_URL")}
          - payment_id: ${input.payment_id}
          - amount: ${input.amount}
          - currency: ${default(map.get(input, "currency"), "USD")}
          - from_account: ${input.from_account}
          - to_account: ${input.to_account}
          - idempotency_key: ${default(map.get(input, "idempotency_key"), input.payment_id)}
          - gateway_force: ${default(map.get(input, "gateway_force"), "")}
          - db_config: ${input.db_config}

    # Step 1: Validate the payment against the database (account exists, balance, fraud checks)
    - validate_payment:
        try:
          call: http.post
          args:
            url: ${db_proxy_url + "/validate-payment"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              payment_id: ${payment_id}
              amount: ${amount}
              currency: ${currency}
              from_account: ${from_account}
              to_account: ${to_account}
              idempotency_key: ${idempotency_key}
              db_host: ${db_config.host}
              db_port: ${db_config.port}
              db_name: ${db_config.database}
              db_user: ${db_config.user}
              db_password: ${db_config.password}
            timeout: 30
          result: validation_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 16
            multiplier: 2
        except:
          as: e
          steps:
            - validation_exception:
                assign:
                  - failure_context:
                      payment_id: ${payment_id}
                      amount: ${amount}
                      currency: ${currency}
                      error:
                        code: "VALIDATION_ERROR"
                        message: ${json.encode_to_string(e)}
                next: handle_payment_failure

    - extract_validation:
        assign:
          - validation: ${validation_response.body.validation}

    # Step 2: Check validation result
    - check_validation:
        switch:
          - condition: ${validation.is_valid == true}
            next: process_payment
        next: validation_failed

    - validation_failed:
        assign:
          - failure_context:
              payment_id: ${payment_id}
              amount: ${amount}
              currency: ${currency}
              error:
                code: "VALIDATION_FAILED"
                message: ${validation.reason}
        next: handle_payment_failure

    # Step 3: Process the payment via the payment gateway with aggressive retries.
    # Uses try/retry/except: retries on gateway timeouts and 5xx errors,
    # but routes declines directly to failure handling.
    - process_payment:
        try:
          call: http.post
          args:
            url: ${payment_gateway_url + "/process"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              payment_id: ${payment_id}
              amount: ${amount}
              currency: ${currency}
              from_account: ${from_account}
              to_account: ${to_account}
              idempotency_key: ${idempotency_key}
              # Pins the simulated outcome for this execution. Without it the
              # decline branch is only reachable by luck (5%), or by redeploying
              # the service with GATEWAY_FORCE set.
              force_outcome: ${gateway_force}
            timeout: 60
          result: payment_response
        retry:
          predicate: ${retry_on_gateway_error}
          max_retries: 5
          backoff:
            initial_delay: 3
            max_delay: 30
            multiplier: 2
        except:
          as: e
          steps:
            - check_decline:
                switch:
                  - condition: ${default(map.get(e, "code"), 0) == 402}
                    assign:
                      - failure_context:
                          payment_id: ${payment_id}
                          amount: ${amount}
                          currency: ${currency}
                          error:
                            code: "PAYMENT_DECLINED"
                            message: "Payment declined by gateway"
                            details: ${json.encode_to_string(e)}
                    next: handle_payment_failure
            - gateway_error:
                assign:
                  - failure_context:
                      payment_id: ${payment_id}
                      amount: ${amount}
                      currency: ${currency}
                      error:
                        code: "GATEWAY_ERROR"
                        message: ${"Payment gateway error after retries - " + json.encode_to_string(e)}
                next: handle_payment_failure

    - extract_payment_result:
        assign:
          - payment_result: ${payment_response.body}

    # Step 4: Update the database to record the successful payment
    - update_database:
        try:
          call: http.post
          args:
            url: ${db_proxy_url + "/update-payment"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              payment_id: ${payment_id}
              status: "completed"
              gateway_transaction_id: ${payment_result.gateway_transaction_id}
              amount_charged: ${payment_result.amount_charged}
              currency: ${payment_result.currency}
              from_account: ${from_account}
              to_account: ${to_account}
              db_host: ${db_config.host}
              db_port: ${db_config.port}
              db_name: ${db_config.database}
              db_user: ${db_config.user}
              db_password: ${db_config.password}
            timeout: 30
          result: db_update_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 16
            multiplier: 2
        except:
          as: e
          steps:
            - db_update_error:
                assign:
                  - failure_context:
                      payment_id: ${payment_id}
                      amount: ${amount}
                      currency: ${currency}
                      payment_result: ${payment_result}
                      error:
                        code: "DB_UPDATE_FAILED"
                        message: ${json.encode_to_string(e)}
                next: handle_payment_failure

    # Step 5: Send success notification. Uses try/except for graceful degradation --
    # if the notification fails, the payment is still valid.
    - send_notification:
        try:
          call: http.post
          args:
            url: ${notification_service_url + "/notify"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              payment_id: ${payment_id}
              status: "completed"
              amount: ${amount}
              currency: ${currency}
              gateway_transaction_id: ${payment_result.gateway_transaction_id}
            timeout: 30
          result: notification_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 16
            multiplier: 2
        except:
          as: e
          steps:
            # Payment succeeded but notification failed. Payment is still valid.
            - notification_failed:
                return:
                  status: "completed_notification_failed"
                  payment_id: ${payment_id}
                  payment_result: ${payment_result}
                  notification_error: ${json.encode_to_string(e)}

    - return_success:
        return:
          status: "completed"
          payment_id: ${payment_id}
          payment_result: ${payment_result}

    # Step 6: Handle payment failure. Record the failure and send failure notification.
    - handle_payment_failure:
        steps:
          - record_failure:
              try:
                call: http.post
                args:
                  url: ${db_proxy_url + "/record-failure"}
                  auth:
                    type: OIDC
                  headers:
                    Content-Type: "application/json"
                  body:
                    payment_id: ${failure_context.payment_id}
                    status: "failed"
                    error_code: ${failure_context.error.code}
                    error_message: ${failure_context.error.message}
                    db_host: ${db_config.host}
                    db_port: ${db_config.port}
                    db_name: ${db_config.database}
                    db_user: ${db_config.user}
                    db_password: ${db_config.password}
                  timeout: 30
                result: failure_record_response
              retry:
                predicate: ${retry_on_server_error}
                max_retries: 3
                backoff:
                  initial_delay: 2
                  max_delay: 16
                  multiplier: 2
              except:
                as: record_error
                steps:
                  - log_record_error:
                      assign:
                        - failure_record_response:
                            body:
                              status: "record_failed"
                              error: ${json.encode_to_string(record_error)}
          - send_failure_notification:
              try:
                call: http.post
                args:
                  url: ${notification_service_url + "/notify"}
                  auth:
                    type: OIDC
                  headers:
                    Content-Type: "application/json"
                  body:
                    payment_id: ${failure_context.payment_id}
                    status: "failed"
                    error_code: ${failure_context.error.code}
                    message: ${failure_context.error.message}
                  timeout: 30
              retry:
                predicate: ${retry_on_server_error}
                max_retries: 3
                backoff:
                  initial_delay: 2
                  max_delay: 16
                  multiplier: 2
              except:
                as: notify_error
                steps:
                  - ignore_notify_error:
                      next: raise_payment_failed
          - raise_payment_failed:
              raise:
                code: "PAYMENT_PROCESSING_FAILED"
                message: '${"Payment " + failure_context.payment_id + " failed: " + failure_context.error.message}'

# Retry predicate: retry on server errors (5xx) and rate limits (429)
retry_on_server_error:
  params: [e]
  steps:
    - check_error:
        switch:
          - condition: ${default(map.get(e, "code"), 0) == 429}
            return: true
          - condition: ${default(map.get(e, "code"), 0) >= 500 and default(map.get(e, "code"), 0) < 600}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "ConnectionError")}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "TimeoutError")}
            return: true
        next: return_false
    - return_false:
        return: false

# Retry predicate for payment gateway: retry on timeouts and 5xx, but not on 4xx (declined)
retry_on_gateway_error:
  params: [e]
  steps:
    - check_error:
        switch:
          - condition: ${default(map.get(e, "code"), 0) == 504}
            return: true
          - condition: ${default(map.get(e, "code"), 0) == 503}
            return: true
          - condition: ${default(map.get(e, "code"), 0) == 502}
            return: true
          - condition: ${default(map.get(e, "code"), 0) == 500}
            return: true
          - condition: ${default(map.get(e, "code"), 0) == 429}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "TimeoutError")}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "ConnectionError")}
            return: true
        next: return_false
    - return_false:
        return: false
