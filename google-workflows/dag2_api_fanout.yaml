# API Fan-Out with Async Callback: Create callback, submit fetch, await result, fan-out, combine
#
# Deploy: terraform/gcp
#
# This is the DAG that shows Google Workflows at its best.
# events.create_callback_endpoint mints a URL, events.await_callback suspends the
# execution against it, and the workflow is *not running* while it waits -- no
# worker, no poller, no billed step, and the wait can last up to a year. Compare
# Airflow, which polls from its triggerer, and Luigi, which cannot suspend at all.
#
# The callback URL goes to the callback-fetch service under the broker's
# `google_workflows` provider (RUNNING.md 2b). It needs its own provider rather
# than plain `http_callback` because a callback endpoint lives on
# workflowexecutions.googleapis.com and rejects an unauthenticated POST -- the
# broker mints a Google access token for it. The service runs with
# AUTO_RESUME=true, so it fetches and resumes hands-off.
#
# Note the auth asymmetry: no step here carries an `auth` block. The fetch service
# and the fixture are both public HTTPS on the Kubernetes cluster, so sending a GCP
# OIDC token to either would be wrong. Only DAG 1/3/4, which call the *private*
# Cloud Run task service, authenticate. The token in this DAG travels the other
# direction: from the broker back into Workflows.
#
# Expected input (all optional; env vars supply the defaults):
# {
#   "url": "https://<fixture-service>/books",
#   "request_config": { "callback_fetch_service_url": "https://..." }
# }

main:
  params: [input]
  steps:
    - init:
        assign:
          # `{}` is NOT a literal in the Workflows expression language -- an
          # inline `${default(..., {})}` is a parse error at deploy time. Bind the
          # empty map as a plain YAML value first, then reference it.
          - empty_map: {}
          # Must exist before `parallel: shared:` can declare it.
          - api_results: []
          - request_config: ${default(map.get(input, "request_config"), empty_map)}
          # `base=` matters: the fixture derives each item's detail URL from it,
          # and its in-cluster default (http://fixture-service:8099) is
          # unreachable from here. per_page=30 gives a fan-out worth measuring --
          # the service defaults to 5.
          - fixture_base: ${sys.get_env("FIXTURE_SERVICE_URL")}
          - fetch_url: ${default(map.get(input, "url"), fixture_base + "/books?per_page=30&base=" + fixture_base)}
          - callback_fetch_service_url: ${default(map.get(request_config, "callback_fetch_service_url"), sys.get_env("CALLBACK_FETCH_SERVICE_URL"))}

    # Step 1: Create a unique callback endpoint. Google Workflows generates a URL
    # that external services can POST to in order to resume this workflow execution.
    - create_callback:
        call: events.create_callback_endpoint
        args:
          http_callback_method: "POST"
        result: callback_details

    # Step 2: Submit the async fetch request to the callback-fetch-service,
    # providing the workflow's callback URL so the service can notify us when done.
    - submit_fetch:
        try:
          call: http.post
          args:
            url: ${callback_fetch_service_url + "/fetch-async"}
            headers:
              Content-Type: "application/json"
              User-Agent: "orchestration-bakeoff/1.0"
            body:
              url: ${fetch_url}
              headers: ${default(map.get(request_config, "fetch_headers"), empty_map)}
              # A callback endpoint on workflowexecutions.googleapis.com only
              # accepts an AUTHENTICATED POST, so the broker needs its own
              # provider: `http_callback` posts bare JSON and would get 401.
              provider: "google_workflows"
              resume_data:
                callback_url: ${callback_details.url}
              correlation_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
            timeout: 10
          result: submit_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 16
            multiplier: 2
        except:
          as: e
          steps:
            - raise_submit_error:
                raise:
                  code: "FETCH_SUBMIT_FAILED"
                  message: ${"Failed to submit async fetch - " + json.encode_to_string(e)}

    - check_submit_accepted:
        switch:
          - condition: ${submit_response.code != 202}
            raise:
              code: "FETCH_SUBMIT_REJECTED"
              message: ${"Callback fetch service returned " + string(submit_response.code)}

    # Step 3: Await the callback. The workflow suspends here with zero resource cost.
    # It will resume when the callback-fetch-service POSTs to the callback URL.
    # Timeout after 60 seconds if the external service does not respond.
    - await_callback:
        try:
          call: events.await_callback
          args:
            callback: ${callback_details}
            timeout: 60
          result: callback_result
        except:
          as: e
          steps:
            - check_timeout:
                switch:
                  - condition: ${text.match_regex(default(map.get(e, "message"), ""), "TimeoutError")}
                    raise:
                      code: "CALLBACK_TIMEOUT"
                      message: "Async fetch did not complete within 60 seconds"
            - raise_callback_error:
                raise:
                  code: "CALLBACK_FAILED"
                  message: ${"Callback await failed - " + json.encode_to_string(e)}

    # Step 4: Process the callback payload. Normalize it into the standard items format.
    - process_result:
        call: process_fetch_result
        args:
          callback_payload: ${callback_result.http_request.body}
          source_url: ${fetch_url}
          request_config: ${request_config}
        result: processed

    # Step 5: Check if there are items to fan out over.
    - check_items_exist:
        switch:
          - condition: ${processed.item_count == 0}
            next: no_items_to_process

    # Step 6: Fan out — make parallel HTTP GET requests for each item's detail URL.
    - fan_out_api_requests:
        try:
          parallel:
            # Spec cap (README.md).
            concurrency_limit: 20
            shared: [api_results]
            for:
              value: item
              in: ${processed.items}
              steps:
                - fetch_item_detail:
                    try:
                      call: http.get
                      args:
                        url: ${item.detail_url}
                        headers:
                          User-Agent: "orchestration-bakeoff/1.0"
                        timeout: 30
                      result: detail_response
                    retry:
                      predicate: ${retry_on_server_error}
                      max_retries: 3
                      backoff:
                        initial_delay: 2
                        max_delay: 16
                        multiplier: 2
                    except:
                      as: e
                      steps:
                        - log_item_error:
                            assign:
                              - detail_response:
                                  body:
                                    id: ${item.id}
                                    error: ${json.encode_to_string(e)}
                                    status: "failed"
                - build_detail_entry:
                    assign:
                      - detail_entry:
                          id: ${item.id}
                          name: ${item.name}
                          data: ${detail_response.body}
                - collect_detail:
                    assign:
                      - api_results: ${list.concat(default(api_results, []), detail_entry)}
        except:
          as: e
          steps:
            - raise_fanout_error:
                raise:
                  code: "FANOUT_FAILED"
                  message: ${"API fan-out failed - " + json.encode_to_string(e)}

    # Step 7: Combine all results into the final output.
    - combine_results:
        call: combine
        args:
          source_url: ${fetch_url}
          item_count: ${processed.item_count}
          api_results: ${api_results}
        result: combined

    - return_result:
        return: ${combined}

    - no_items_to_process:
        return:
          status: "no_items"
          message: "No items found from initial content fetch."
          source_url: ${fetch_url}

# Subworkflow: Normalize the callback payload into the items format
process_fetch_result:
  params: [callback_payload, source_url, request_config]
  steps:
    - validate_callback:
        assign:
          - callback_status: ${default(map.get(callback_payload, "status"), "unknown")}
    - check_status:
        switch:
          - condition: ${callback_status != "completed"}
            raise:
              code: "FETCH_FAILED"
              message: ${"Fetch service returned status '" + callback_status + "'"}
    - extract_body:
        assign:
          - body: ${callback_payload.body}
    - build_items:
        assign:
          - items: []
    - iterate_body:
        for:
          value: raw_item
          in: ${body}
          steps:
            - build_item:
                assign:
                  - new_item:
                      id: ${raw_item.id}
                      name: ${default(map.get(raw_item, "title"), default(map.get(raw_item, "name"), string(raw_item.id)))}
                      detail_url: ${raw_item.url}
            - append_item:
                assign:
                  - items: ${list.concat(items, new_item)}
    - return_processed:
        return:
          source_url: ${source_url}
          item_count: ${len(items)}
          items: ${items}
          request_config: ${request_config}

# Subworkflow: Combine fan-out results into a single response
combine:
  params: [source_url, item_count, api_results]
  steps:
    - count_successes:
        assign:
          - successful: 0
          - failed: 0
    - tally_results:
        for:
          value: result
          in: ${api_results}
          steps:
            - check_result:
                switch:
                  - condition: ${default(map.get(result.data, "status"), "ok") == "failed"}
                    assign:
                      - failed: ${failed + 1}
                  - condition: true
                    assign:
                      - successful: ${successful + 1}
    - return_combined:
        return:
          status: "completed"
          source_url: ${source_url}
          total_items: ${item_count}
          successful: ${successful}
          failed: ${failed}
          results: ${api_results}

retry_on_server_error:
  params: [e]
  steps:
    - check_error:
        switch:
          - condition: ${default(map.get(e, "code"), 0) == 429}
            return: true
          - condition: ${default(map.get(e, "code"), 0) >= 500 and default(map.get(e, "code"), 0) < 600}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "ConnectionError")}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "TimeoutError")}
            return: true
        next: return_false
    - return_false:
        return: false
