# CSV ETL Pipeline: Unzip, parallel load to Postgres, SQL transform, convert to Parquet
#
# Deploy: terraform/gcp  (which also uploads test-data/sample-data.zip to the
# bucket and passes ZIP_URL / GCS_BUCKET as workflow env vars, so an execution
# needs no manual setup).
#
# The `parallel` block over csv_keys is Workflows' fan-out primitive: the branch
# count comes from a runtime value, which is genuine dynamic parallelism, but note
# there is no concurrency cap to set -- see the README on the spec's max-10.
#
# Expected input (every field optional; env vars supply the defaults):
# {
#   "zip_url": "gs://<bucket>/input/sample-data.zip",
#   "extract_prefix": "extracted/",
#   "gcs_bucket": "<bucket>",
#   "db_config": { "host": "...", "port": 5432, "database": "orchestration", "user": "...", "password": "..." }
# }

main:
  params: [input]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          # One Cloud Run service serves both route groups; two names kept so the
          # parallel with the Step Functions lambdas stays legible.
          - processing_service_url: ${sys.get_env("TASK_SERVICE_URL")}
          - db_proxy_url: ${sys.get_env("TASK_SERVICE_URL")}
          - zip_url: ${default(map.get(input, "zip_url"), sys.get_env("ZIP_URL"))}
          - extract_prefix: ${default(map.get(input, "extract_prefix"), "extracted/")}
          - db_config: ${input.db_config}
          - gcs_bucket: ${default(map.get(input, "gcs_bucket"), sys.get_env("GCS_BUCKET"))}

    - unzip_file:
        try:
          call: http.post
          args:
            url: ${processing_service_url + "/unzip"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              zip_url: ${zip_url}
              gcs_bucket: ${gcs_bucket}
              extract_prefix: ${extract_prefix}
            timeout: 120
          result: unzip_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 16
            multiplier: 2
        except:
          as: e
          steps:
            - raise_unzip_error:
                raise:
                  code: "UNZIP_FAILED"
                  message: ${"Unzip failed - " + json.encode_to_string(e)}

    - extract_csv_keys:
        assign:
          - csv_keys: ${unzip_response.body.csv_keys}
          - s3_bucket: ${unzip_response.body.gcs_bucket}
          # A `shared:` variable must already exist -- declaring one that was
          # never assigned fails at deploy time with "symbol is not a variable
          # name". Nothing wrote to it either, so every branch's row count was
          # being thrown away.
          - load_results: []

    - process_csvs:
        try:
          parallel:
            # Spec cap (README.md).
            concurrency_limit: 10
            shared: [load_results]
            for:
              value: csv_key
              in: ${csv_keys}
              steps:
                - load_csv_to_postgres:
                    try:
                      call: http.post
                      args:
                        url: ${db_proxy_url + "/load-csv"}
                        auth:
                          type: OIDC
                        headers:
                          Content-Type: "application/json"
                        body:
                          gcs_bucket: ${s3_bucket}
                          csv_key: ${csv_key}
                          db_host: ${db_config.host}
                          db_port: ${db_config.port}
                          db_name: ${db_config.database}
                          db_user: ${db_config.user}
                          db_password: ${db_config.password}
                        timeout: 120
                      result: load_result
                    retry:
                      predicate: ${retry_on_server_error}
                      max_retries: 6
                      backoff:
                        initial_delay: 2
                        max_delay: 64
                        multiplier: 2
                - collect_load_result:
                    assign:
                      - load_results: ${list.concat(load_results, load_result.body)}
        except:
          as: e
          steps:
            - raise_process_error:
                raise:
                  code: "CSV_PROCESSING_FAILED"
                  message: ${"Parallel CSV load failed - " + json.encode_to_string(e)}

    - run_sql_transform:
        try:
          call: http.post
          args:
            url: ${db_proxy_url + "/execute-sql"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              db_host: ${db_config.host}
              db_port: ${db_config.port}
              db_name: ${db_config.database}
              db_user: ${db_config.user}
              db_password: ${db_config.password}
              sql_template: "transform"
              csv_keys: ${csv_keys}
            timeout: 900
          result: transform_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 2
          backoff:
            initial_delay: 10
            max_delay: 40
            multiplier: 2
        except:
          as: e
          steps:
            - raise_transform_error:
                raise:
                  code: "SQL_TRANSFORM_FAILED"
                  message: ${"SQL transform failed - " + json.encode_to_string(e)}

    - convert_to_parquet:
        try:
          call: http.post
          args:
            url: ${processing_service_url + "/convert-to-parquet"}
            auth:
              type: OIDC
            headers:
              Content-Type: "application/json"
            body:
              gcs_bucket: ${gcs_bucket}
              db_host: ${db_config.host}
              db_port: ${db_config.port}
              db_name: ${db_config.database}
              db_user: ${db_config.user}
              db_password: ${db_config.password}
              transform_result: ${transform_response.body}
            timeout: 600
          result: parquet_response
        retry:
          predicate: ${retry_on_server_error}
          max_retries: 3
          backoff:
            initial_delay: 2
            max_delay: 32
            multiplier: 2
        except:
          as: e
          steps:
            - raise_parquet_error:
                raise:
                  code: "PARQUET_CONVERSION_FAILED"
                  message: ${"Parquet conversion failed - " + json.encode_to_string(e)}

    - return_result:
        return:
          status: "completed"
          csv_count: ${len(csv_keys)}
          loads: ${load_results}
          transform: ${transform_response.body}
          parquet: ${parquet_response.body}

retry_on_server_error:
  params: [e]
  steps:
    - check_error:
        switch:
          - condition: ${default(map.get(e, "code"), 0) == 429}
            return: true
          - condition: ${default(map.get(e, "code"), 0) >= 500 and default(map.get(e, "code"), 0) < 600}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "ConnectionError")}
            return: true
          - condition: ${text.match_regex(default(map.get(e, "message"), ""), "TimeoutError")}
            return: true
        next: return_false
    - return_false:
        return: false
